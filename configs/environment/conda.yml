name: landau-pic-surrogate
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy=1.26.4
  - h5py=3.10.0
  - scipy=1.11.4
  - matplotlib=3.8.4
  - numba=0.59.1
  - pip
  - pytest

# PyTorch/CUDA builds depend on the host driver. Install the appropriate
# PyTorch build before `pip install -e .` when recreating a GPU environment.
